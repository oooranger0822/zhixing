<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>通知中心</title>
  <link rel="stylesheet" href="notification.css">
  <link rel="stylesheet" href="./css/navigation.css">
</head>
<body class="with-site-navigation">
  <aside class="site-sidebar" aria-label="工作台导航">
    <a class="site-brand" href="./index.html" aria-label="知行首页"><span class="site-brand-mark" aria-hidden="true">知</span><span>知行<small>校园信息工作台</small></span></a>
    <p class="site-nav-label">我的空间</p>
    <nav class="site-navigation" aria-label="主导航">
      <a href="./index.html"><span aria-hidden="true">▦</span>首页概览</a>
      <a href="./index.html#highlights"><span aria-hidden="true">☆</span>今日重点</a>
      <a href="./notification.html" aria-current="page"><span aria-hidden="true">☷</span>最新通知</a>
      <a class="site-task-link" href="./task.html"><span aria-hidden="true"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" focusable="false"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="m7.5 12 3 3 6-6"/></svg></span>近期待办</a>
    </nav>
  </aside>
  <main class="notification-page">
    <section class="notification-panel" aria-labelledby="page-title">
      <header class="panel-header">
        <div class="title-wrap">
          <span class="title-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" role="img">
              <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M10 21h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </span>
          <div>
            <p class="eyebrow">MESSAGE CENTER</p>
            <h1 id="page-title">通知中心</h1>
          </div>
        </div>
        <div class="header-actions">
          <button class="simulate-btn" id="toggleMessageForm" type="button" aria-expanded="false" aria-controls="messageForm">
            <span aria-hidden="true">＋</span>
            模拟群消息
          </button>
          <button class="mark-all-btn" id="markAllRead" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m4 12 4 4L18 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="m12 16 2 2 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>全部已读</span>
          </button>
        </div>
      </header>

      <form class="message-form" id="messageForm" hidden>
        <div class="form-field">
          <label for="senderInput">发送人</label>
          <input id="senderInput" name="sender" type="text" maxlength="30" placeholder="例如：班主任" required>
        </div>
        <div class="form-field">
          <label for="sourceInput">消息来源</label>
          <input id="sourceInput" name="source" type="text" maxlength="50" placeholder="例如：数据结构课程群" required>
        </div>
        <div class="form-field form-content">
          <label for="contentInput">内容</label>
          <textarea id="contentInput" name="content" rows="5" placeholder="请输入群消息内容" aria-describedby="contentCount" required></textarea>
          <small id="contentCount" role="status">0 / 10000 字符</small>
        </div>
        <div class="form-field">
          <label for="referenceDateInput">时间参考日期（北京时间，可修正）</label>
          <input id="referenceDateInput" type="date" required>
        </div>
        <div class="form-field">
          <label for="typeInput">分类</label>
          <select id="typeInput" name="type">
            <option value="course">课程</option>
            <option value="assignment">作业</option>
            <option value="exam">考试</option>
            <option value="activity">活动</option>
            <option value="class">班级</option>
            <option value="other">其他</option>
          </select>
        </div>
        <div class="form-field form-token">
          <label for="aiTokenInput">AI 令牌（可选，仅本次会话内存）</label>
          <input id="aiTokenInput" name="aiToken" type="password" maxlength="128" autocomplete="off" placeholder="粘贴 B 的队员令牌，仅用于 AI 识别">
        </div>
        <div class="form-actions">
          <button class="ai-recognize-btn" id="aiRecognize" type="button">AI 识别</button>
          <button class="submit-message-btn" id="submitMessage" type="submit">提交</button>
        </div>
        <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
        <button class="ai-retry-btn" id="aiRetrySave" type="button" hidden>重试保存识别结果</button>

        <section class="ai-result" id="aiResult" hidden aria-label="AI 识别结果">
          <div class="ai-result-head">
            <strong>AI 识别结果（请人工核对）</strong>
            <button class="ai-result-close" id="aiResultClose" type="button" aria-label="关闭">×</button>
          </div>
          <dl class="ai-result-list">
            <div><dt>分类</dt><dd id="aiPreviewType"></dd></div>
            <div><dt>课程</dt><dd id="aiPreviewCourse"></dd></div>
            <div><dt>任务标题</dt><dd id="aiPreviewTitle"></dd></div>
            <div><dt>任务要求</dt><dd id="aiPreviewContent"></dd></div>
            <div><dt>截止时间</dt><dd id="aiPreviewDeadline"></dd></div>
            <div><dt>截止描述</dt><dd id="aiPreviewDeadlineText"></dd></div>
            <div><dt>置信度</dt><dd id="aiPreviewConfidence"></dd></div>
          </dl>
        </section>
      </form>

      <nav class="tabs" aria-label="通知分类">
        <button class="tab active" type="button" data-category="all">全部 <span class="tab-count" id="allCount">0</span></button>
        <button class="tab" type="button" data-category="course">课程 <span class="tab-count" id="courseCount">0</span></button>
        <button class="tab" type="button" data-category="assignment">作业 <span class="tab-count" id="assignmentCount">0</span></button>
        <button class="tab" type="button" data-category="exam">考试 <span class="tab-count" id="examCount">0</span></button>
        <button class="tab" type="button" data-category="activity">活动 <span class="tab-count" id="activityCount">0</span></button>
        <button class="tab" type="button" data-category="class">班级 <span class="tab-count" id="classCount">0</span></button>
        <button class="tab" type="button" data-category="other">其他 <span class="tab-count" id="otherCount">0</span></button>
      </nav>

      <div class="list-container" id="notificationList" aria-live="polite"></div>

      <footer class="panel-footer">
        <button class="load-more" id="loadMore" type="button">加载更多通知</button>
      </footer>
    </section>
  </main>

  <script type="module" src="notification.js"></script>
</body>
</html>
