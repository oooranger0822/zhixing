<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>任务管理</title>
  <link rel="stylesheet" href="task.css">
</head>
<body>
  <main class="task-page">
    <section class="task-panel" aria-labelledby="page-title">

      <!-- 页头 -->
      <header class="panel-header">
        <div class="title-wrap">
          <span class="title-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" role="img">
              <rect x="4" y="5" width="16" height="16" rx="4" fill="none" stroke="currentColor" stroke-width="1.8"/>
              <path d="m8 12 3 3 5-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <div>
            <p class="eyebrow">TASK MANAGEMENT</p>
            <h1 id="page-title">任务管理</h1>
          </div>
        </div>
        <div class="header-actions">
          <button class="extract-btn" id="extractEntry" type="button">
            <span aria-hidden="true">＋</span>
            从通知生成任务
          </button>
        </div>
      </header>

      <!-- 提示条（写入结果等瞬时消息） -->
      <div class="status-banner" id="statusBanner" role="alert" hidden></div>

      <!-- 统计卡片 -->
      <section class="stats" aria-label="任务统计">
        <div class="stat-card stat-all">
          <span class="stat-value" id="allCount">0</span>
          <span class="stat-label">全部任务</span>
        </div>
        <div class="stat-card stat-pending">
          <span class="stat-value" id="pendingCount">0</span>
          <span class="stat-label">待完成</span>
        </div>
        <div class="stat-card stat-completed">
          <span class="stat-value" id="completedCount">0</span>
          <span class="stat-label">已完成</span>
        </div>
      </section>

      <!-- 分类 Tab -->
      <nav class="tabs" aria-label="任务分类">
        <button class="tab active" type="button" data-filter="all">全部</button>
        <button class="tab" type="button" data-filter="pending">待完成</button>
        <button class="tab" type="button" data-filter="completed">已完成</button>
      </nav>

      <!-- 主体：左侧列表 + 右侧详情 -->
      <div class="content">
        <section class="list-column" aria-label="任务列表">
          <div class="list-container" id="taskList" aria-live="polite"></div>
        </section>
        <aside class="detail-column" id="detailColumn" aria-label="任务详情">
          <div class="detail-panel" id="taskDetail"></div>
        </aside>
      </div>

    </section>
  </main>

  <!-- 从通知生成任务弹窗 -->
  <div class="modal-overlay" id="extractModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="extractTitle">
      <header class="modal-header">
        <div>
          <p class="eyebrow">FROM NOTIFICATION</p>
          <h2 id="extractTitle">从通知生成任务</h2>
        </div>
        <button class="modal-close" id="extractClose" type="button" aria-label="关闭">×</button>
      </header>

      <div class="modal-body">
        <section class="picker-section" aria-label="选择来源通知">
          <p class="field-label">选择来源通知</p>
          <div class="notification-list" id="extractNotificationList"></div>
        </section>

        <form class="extract-form" id="extractForm" novalidate>
          <div class="form-field">
            <label for="taskTitleInput">任务标题 <span class="required">*</span></label>
            <input id="taskTitleInput" type="text" maxlength="60" placeholder="请输入任务标题" required>
          </div>
          <div class="form-field">
            <label for="taskCourseInput">课程</label>
            <input id="taskCourseInput" type="text" maxlength="30" placeholder="例如：高等数学">
          </div>
          <div class="form-field">
            <label for="taskContentInput">任务内容</label>
            <textarea id="taskContentInput" rows="3" maxlength="500" placeholder="任务具体内容"></textarea>
          </div>
          <div class="form-field">
            <label for="taskDeadlineInput">截止时间（未确认可留空）</label>
            <input id="taskDeadlineInput" type="datetime-local">
          </div>
          <div class="form-field">
            <label for="taskDeadlineTextInput">截止时间说明</label>
            <input id="taskDeadlineTextInput" type="text" maxlength="60" placeholder="例如：本周五前">
          </div>
        </form>

        <p class="modal-status" id="extractStatus" role="alert" hidden></p>
      </div>

      <footer class="modal-footer">
        <button class="btn-secondary" id="extractCancel" type="button">取消</button>
        <button class="btn-primary" id="extractSubmit" type="button" disabled>生成任务</button>
      </footer>
    </div>
  </div>

  <script type="module" src="task.js"></script>
</body>
</html>
